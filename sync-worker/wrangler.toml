# Wrangler configuration for Cloudflare Worker 9 AM ET odds-lock cron
name = "dubbs-bets-sync-cron"
main = "index.js"
compatibility_date = "2026-06-10"

[triggers]
crons = ["0 13 * * *"] # 13:00 UTC = 9:00 AM ET during World Cup 2026

[vars]
PAGES_URL = "https://dubbs-bets.pages.dev"
# SYNC_SECRET should be set as a secret via wrangler secret put SYNC_SECRET
